# Deploys Hyderabad Tycoon to Cloudflare Workers on every push to main.
#
# Repository secrets (Settings -> Secrets and variables -> Actions). All five are required:
#   CLOUDFLARE_API_TOKEN   API token created from the "Edit Cloudflare Workers" template
#   CLOUDFLARE_ACCOUNT_ID  your Cloudflare account id
#   DATABASE_URL           Neon connection string (migration here + the Worker's runtime secret)
#   JWT_SECRET             long random string that signs login sessions (use a NEW one for production)
#   GOOGLE_CLIENT_ID       the OAuth *Web* client id
#
# After the deploy, the last step copies DATABASE_URL, JWT_SECRET and GOOGLE_CLIENT_ID into the
# Worker as runtime secrets, so there is no manual `wrangler secret put`. To rotate one, change the
# GitHub secret and re-run this workflow.
name: Deploy

on:
  push:
    branches: [main]

# One deploy at a time; a newer push waits instead of cancelling a deploy half-way.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Fail fast with a clear message instead of a confusing error half-way through. Only names are
      # printed, never values.
      - name: Check required secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
        run: |
          missing=0
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID DATABASE_URL JWT_SECRET GOOGLE_CLIENT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository secret $name is not set (Settings -> Secrets and variables -> Actions)"
              missing=1
            fi
          done
          exit $missing

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build the web app
        run: npm run build

      # Additive, idempotent (CREATE ... IF NOT EXISTS / ADD COLUMN IF NOT EXISTS), so it is safe
      # to run before the new code goes live and safe to repeat. Prints table names + row counts only.
      - name: Migrate database
        run: node scripts/migrate.js
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      # Runs after the deploy so the Worker already exists. The JSON file is written with owner-only
      # permissions on the throw-away runner and deleted straight away; GitHub also masks the values.
      - name: Sync Worker runtime secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
        run: |
          node -e "require('fs').writeFileSync(process.env.RUNNER_TEMP + '/secrets.json', JSON.stringify({ DATABASE_URL: process.env.DATABASE_URL, JWT_SECRET: process.env.JWT_SECRET, GOOGLE_CLIENT_ID: process.env.GOOGLE_CLIENT_ID }), { mode: 0o600 })"
          npx wrangler secret bulk "$RUNNER_TEMP/secrets.json"
          rm -f "$RUNNER_TEMP/secrets.json"
